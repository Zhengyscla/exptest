# GhostLock 5.10.43 profile for HONOR OXF-AN00 — v2 (物理映射实验)
#
# 与 profile_5.10.43-oxf-an00.conf 的唯一差异：
#   kernel_phys_offset 0x10000000 -> 0x00000000
#   kernel_phys_load   0x10000000 -> 0x10000000
# 即 delta = load - offset 由 0 变为 0x10000000。
#
# 目的：验证"内核镜像物理地址 = DRAM 基址 + 0x10000000"这个猜想。
# 参数与偏移均已在本机 BOOT.img 内核上静态核对过，未改动。
release = "5.10.43"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
kernel_phys_load = 268435456          # 0x10000000
kernel_phys_offset = 0                # 0x00000000
route {
  multicast_waiter {
    waiter_off = 96
    buffer_size = 264
    task_offset = 48
    lock_offset = 56
    compact_waiter = 1
  }
}
fallback {
  to = "none"
}
kernelsnitch {
  collisions = 8
  mm_struct_sz = 1024
}
task_struct {
  prio = 288
  normal_prio = 292
  sched_task_group = 704
  pi_lock = 2260
  pi_waiters = 2280
  pi_top_task = 2296
  pi_blocked_on = 2304
  pid = 1600
  tgid = 1604
  atomic_flags = 1544
  real_cred = 2040
  cred = 2048
  comm = 2064
  tasks = 1336
  seccomp = 2224
}
cred {
  copy_size = 168
  usage_offset = 0
  usage_value = 1
  caps_offset = 40
  caps_count = 5
  caps_value = -1
  ref_count = 3
  ref0_offset = 128
  ref1_offset = 136
  ref2_offset = 144
  ref3_offset = null
  ref0_image = -274554276608       # 0xffffffc0134a3500 root_user
  ref1_image = -274554277144       # 0xffffffc0134a32e8 init_user_ns
  ref2_image = -274554271928       # 0xffffffc0134a4748 init_groups
  ref3_image = null
}
offset {
  init_task = 55134144
  init_cred = 55199392
  empty_zero_page = 63438848
  root_task_group = 63465344
  selinux_enforcing = 65092296     # selinux_state; 见 notes 第 5 节（可能根本没有 enforcing 字段）
  selinux_blob_sizes = 39981192
  security_hook_heads = 39979512
  slide_nfulnl_logger = 55085264
  slide_loggers_0_1 = 55085048
  slide_boot_id = 65248476
}
