# GhostLock 5.10.43 profile for HONOR OXF-AN00 — v3 (pselect 路由实验)
#
# 相比 v2 的唯一差异：路由从 multicast_waiter 换成 select_stack，waiter_shift = -2。
# 依据：
#   1) 本机 build config 打印 slide=pselect main=pselect；
#   2) Redmi K50 Pro (5.10.209) 的成功日志正是
#      "pselect route setup shift=-2 ... calls=1 success=1 ... SELinux permissive"。
# 其余（物理映射 delta=0x10000000、结构偏移、符号偏移）与 v2 完全相同。
release = "5.10.43"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
kernel_phys_load = 268435456          # 0x10000000
kernel_phys_offset = 0                # 0x00000000
route {
  select_stack {
    waiter_shift = -2
  }
}
fallback {
  to = "none"
}
kernelsnitch {
  collisions = 8
  mm_struct_sz = 1024
}
task_struct {
  prio = 288
  normal_prio = 292
  sched_task_group = 704
  pi_lock = 2260
  pi_waiters = 2280
  pi_top_task = 2296
  pi_blocked_on = 2304
  pid = 1600
  tgid = 1604
  atomic_flags = 1544
  real_cred = 2040
  cred = 2048
  comm = 2064
  tasks = 1336
  seccomp = 2224
}
cred {
  copy_size = 168
  usage_offset = 0
  usage_value = 1
  caps_offset = 40
  caps_count = 5
  caps_value = -1
  ref_count = 3
  ref0_offset = 128
  ref1_offset = 136
  ref2_offset = 144
  ref3_offset = null
  ref0_image = -274554276608       # 0xffffffc0134a3500 root_user
  ref1_image = -274554277144       # 0xffffffc0134a32e8 init_user_ns
  ref2_image = -274554271928       # 0xffffffc0134a4748 init_groups
  ref3_image = null
}
offset {
  init_task = 55134144
  init_cred = 55199392
  empty_zero_page = 63438848
  root_task_group = 63465344
  selinux_enforcing = 65092296     # selinux_state; 见 notes 第 10 节（可能没有 enforcing 字段）
  selinux_blob_sizes = 39981192
  security_hook_heads = 39979512
  slide_nfulnl_logger = 55085264
  slide_loggers_0_1 = 55085048
  slide_boot_id = 65248476
}
